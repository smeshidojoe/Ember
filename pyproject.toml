[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-dl"
version = "0.9.0"
description = "Extract and download media from social media"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["requests>=2.25"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://smeshidojoe.github.io/Ember/"
Documentation = "https://smeshidojoe.github.io/Ember/docs/"
Source = "https://github.com/smeshidojoe/Ember"
Issues = "https://github.com/smeshidojoe/Ember/issues"

[project.optional-dependencies]
# --cookies-from-browser works out of the box (no extra deps) for Firefox and Windows-Chromium;
# yt-dlp is only an optional fallback (e.g. Chromium on macOS/Linux)
browser = ["yt-dlp"]
dev = ["pytest>=7"]

[project.scripts]
ember = "ember.__main__:_run"

[tool.setuptools.packages.find]
include = ["ember*"]

[tool.setuptools.package-data]
ember = ["py.typed"]
